<div class="app-shell">
  @if (mobileNavOpen()) {
    <div class="sidebar-backdrop" (click)="closeMobileNav()"></div>
  }

  <aside class="app-sidebar" [class.app-sidebar--open]="mobileNavOpen()">
    <div class="app-brand">
      <span class="app-brand-mark">
        <svg viewBox="0 0 100 100" width="22" height="22" role="img" aria-label="Symbole Immogix">
          <polygon points="32,28 68,10 92,45 58,55" fill="#2B7CE2" />
          <polygon points="58,55 92,45 92,78 58,92" fill="#1D5FA8" />
          <polygon points="24,37 46,48 46,82 24,73" fill="#1B4F88" />
          <polygon points="46,68 56,72 56,92 46,88" fill="#2B7CE2" />
        </svg>
      </span>
      <span class="app-brand-name">IMMOGIX</span>
    </div>

    <nav class="app-nav">
      @for (item of navItems; track item.route) {
        <a
          class="app-nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeMobileNav()"
        >
          <i [class]="item.icon"></i>
          <span>{{ item.translationKey | translate }}</span>
        </a>
      }
    </nav>

    <a class="app-help-link" href="#">
      <i class="pi pi-question-circle"></i>
      {{ 'shell.help' | translate }}
    </a>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <button type="button" class="hamburger-btn" [attr.aria-label]="'shell.nav.dashboard' | translate" (click)="toggleMobileNav()">
        <i class="pi pi-bars"></i>
      </button>

      <div class="app-topbar-org">
        <span class="icon-box icon-box-sm icon-box-primary"><i class="pi pi-briefcase"></i></span>
        <div>
          <div class="app-topbar-org-name">{{ session()?.organizationName }}</div>
          <div class="app-topbar-org-sub">{{ 'shell.activeOrganization' | translate }}</div>
        </div>
      </div>

      <div class="app-topbar-actions">
        <div class="locale-switch" role="group" [attr.aria-label]="'shell.language' | translate">
          <button type="button" class="locale-btn" [class.locale-btn--active]="locale() === 'fr'" (click)="setLocale('fr')">FR</button>
          <button type="button" class="locale-btn" [class.locale-btn--active]="locale() === 'en'" (click)="setLocale('en')">EN</button>
        </div>

        <button type="button" class="icon-btn" [attr.aria-label]="'shell.notifications' | translate">
          <i class="pi pi-bell"></i>
        </button>

        <button type="button" class="user-menu-trigger" (click)="userMenu.toggle($event)">
          <p-avatar [label]="initials()" shape="circle" styleClass="app-user-avatar" />
          <span class="user-menu-text">
            <span class="user-menu-name">{{ session()?.displayName }}</span>
            <span class="user-menu-role">{{ 'shell.userMenu.connected' | translate }}</span>
          </span>
          <i class="pi pi-chevron-down"></i>
        </button>
        <p-menu #userMenu [model]="userMenuItems()" [popup]="true" />
      </div>
    </header>

    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>
