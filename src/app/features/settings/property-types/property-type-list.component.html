<div class="page-header">
  <div>
    <h1>{{ 'settings.propertyTypes.title' | translate }}</h1>
    <p>{{ 'settings.propertyTypes.subtitle' | translate }}</p>
  </div>
  <p-button [label]="'settings.propertyTypes.newButton' | translate" icon="pi pi-plus" (onClick)="openCreateDialog()" />
</div>

<div class="surface-card">
  <p-table [value]="propertyTypes()" [loading]="loading()" dataKey="id" [rowHover]="true" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>{{ 'common.name' | translate }}</th>
        <th>{{ 'common.description' | translate }}</th>
        <th class="actions-col"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-propertyType>
      <tr>
        <td>
          <div class="entity-name">
            <span class="icon-box icon-box-sm icon-box-primary"><i class="pi pi-building"></i></span>
            {{ propertyType.name }}
          </div>
        </td>
        <td>{{ propertyType.description || '—' }}</td>
        <td class="actions-col">
          <p-button icon="pi pi-pencil" [text]="true" severity="secondary" (onClick)="openEditDialog(propertyType)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmDelete(propertyType)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="empty-state">
          <i class="pi pi-building"></i>
          <p>{{ 'settings.propertyTypes.emptyMessage' | translate }}</p>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [header]="(editingId() ? 'settings.propertyTypes.editDialog' : 'settings.propertyTypes.newDialog') | translate" [modal]="true" [(visible)]="dialogVisible" [style]="{ width: '30rem' }">
  <form [formGroup]="form" (ngSubmit)="submit()" class="entity-form">
    <div class="field">
      <label for="name">{{ 'common.name' | translate }} <span class="required-mark">{{ 'common.requiredMark' | translate }}</span></label>
      <input pInputText id="name" formControlName="name" class="w-full" placeholder="ex. Résidentiel" />
    </div>
    <div class="field">
      <label for="description">{{ 'common.description' | translate }}</label>
      <input pInputText id="description" formControlName="description" class="w-full" />
    </div>
    <div class="dialog-actions">
      <p-button [label]="'common.cancel' | translate" severity="secondary" [text]="true" (onClick)="dialogVisible.set(false)" type="button" />
      <p-button [label]="(editingId() ? 'common.save' : 'common.create') | translate" icon="pi pi-check" type="submit" [loading]="submitting()" />
    </div>
  </form>
</p-dialog>
