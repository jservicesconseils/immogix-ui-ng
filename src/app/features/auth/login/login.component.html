<div class="login-page">
  <!-- Image de marque fournie par l'utilisateur (logo, slogan, photo,
       grille de fonctionnalites, skyline deja composes dans le fichier
       -- public/brand/login-hero.png). Ratio quasi identique a celui du
       panneau (0.8), donc background-size: contain ne laisse quasiment
       pas de bande -- et le degrade CSS en second plan (meme direction
       diagonale que l'image) rend la fine bande residuelle invisible
       si jamais le ratio du panneau s'ecarte du ratio de l'image. Le
       texte est incruste dans l'image en francais : ce panneau ne suit
       pas le changement de langue EN/FR, seul le formulaire a droite
       reste traduit. -->
  <div class="login-brand" role="img" aria-label="Immogix — Maisons, immeubles locatifs, immobilier intelligent."></div>

  <div class="login-form-side">
    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="login-form-header">
        <div class="login-form-icon">
          <svg viewBox="0 0 100 100" width="24" height="24" role="img" aria-label="Symbole Immogix">
            <polygon points="32,28 68,10 92,45 58,55" fill="#2B7CE2" />
            <polygon points="58,55 92,45 92,78 58,92" fill="#1D5FA8" />
            <polygon points="24,37 46,48 46,82 24,73" fill="#1B4F88" />
            <polygon points="46,68 56,72 56,92 46,88" fill="#2B7CE2" />
          </svg>
        </div>
        <h2>{{ 'login.title' | translate }}</h2>
        <p>{{ 'login.subtitle' | translate }}</p>
      </div>

      <div class="field">
        <label for="email">{{ 'login.email' | translate }} <span class="required-mark">{{ 'common.requiredMark' | translate }}</span></label>
        <input pInputText id="email" formControlName="email" [placeholder]="'login.emailPlaceholder' | translate" class="w-full" />
      </div>

      <div class="field">
        <label for="password">{{ 'login.password' | translate }} <span class="required-mark">{{ 'common.requiredMark' | translate }}</span></label>
        <p-password
          inputId="password"
          formControlName="password"
          [placeholder]="'login.passwordPlaceholder' | translate"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>

      <div class="login-form-row">
        <div class="field-checkbox">
          <p-checkbox formControlName="rememberMe" [binary]="true" inputId="rememberMe" />
          <label for="rememberMe">{{ 'login.rememberMe' | translate }}</label>
        </div>
        <a href="#" class="login-link" (click)="$event.preventDefault()">{{ 'login.forgotPassword' | translate }}</a>
      </div>

      <p-button type="submit" [label]="'login.submit' | translate" icon="pi pi-sign-in" styleClass="w-full" [loading]="submitting()" />

      <p class="login-signup">
        {{ 'login.noAccount' | translate }}
        <a href="#" class="login-link" (click)="$event.preventDefault()">{{ 'login.signup' | translate }}</a>
      </p>
    </form>
  </div>
</div>
